[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vigorsync-offline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "matplotlib==3.10.9",
    "mediapipe==0.10.21",
    "numpy==1.26.4",
    "opencv-contrib-python==4.11.0.86",
    "Pillow==12.3.0",
    "protobuf==4.25.9",
    "python-multipart==0.0.32",
    "scipy==1.14.1",
    "uvicorn[standard]==0.54.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
