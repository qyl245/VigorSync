openapi: 3.1.0
info:
  title: VigorSync Contract API
  version: 0.1.0
  description: |
    Frozen M0 contract for the VigorSync core API and local Live Engine.
    High-rate video and landmarks stay on the mirror device. The mobile client
    receives low-frequency summaries only.
  contact:
    name: VigorSync
servers:
  - url: http://{host}:8011
    description: Core API; loopback in development and LAN in production.
    variables:
      host:
        default: 127.0.0.1
        description: Core host reachable by the paired mobile device.
tags:
  - name: health
  - name: pairing
  - name: sessions
  - name: events
  - name: reports
  - name: internal
  - name: live-engine
  - name: websocket
  - name: home
x-contract-version: v1
x-session-state-machine: ./session-state-machine.json
x-trust-boundaries:
  core-api: LAN with bearer token
  live-engine: loopback 127.0.0.1 only with X-Internal-Token
  mirror-preview: loopback MJPEG and WebSocket
  mobile-live-data: 2-5 Hz summaries only, never raw frames or landmarks

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: pairing-token
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: ./common.schema.json#/$defs/SessionId
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same key and operation must return the original result.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    AfterSeq:
      name: after_seq
      in: query
      required: false
      description: Return events whose seq is greater than this value.
      schema:
        type: integer
        minimum: 0
        default: 0
    EventLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    SessionListLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SessionStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: ./common.schema.json#/$defs/SessionStatus
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 256
        default: ""
    IncludeReport:
      name: include_report
      in: query
      required: false
      schema:
        type: boolean
        default: false
    MirrorWebSocketProtocols:
      name: Sec-WebSocket-Protocol
      in: header
      required: true
      description: Offer vigorsync.v1 and vigorsync.token.<mirror_token>.
      schema:
        type: string
        minLength: 8

  responses:
    BadRequest:
      description: Invalid request body, path, query or state for this operation.
      content:
        application/json:
          schema:
            $ref: ./common.schema.json#/$defs/ErrorEnvelope
    Unauthorized:
      description: Missing or invalid bearer, mirror or internal token.
      content:
        application/json:
          schema:
            $ref: ./common.schema.json#/$defs/ErrorEnvelope
    NotFound:
      description: Session, job or report was not found.
      content:
        application/json:
          schema:
            $ref: ./common.schema.json#/$defs/ErrorEnvelope
    Conflict:
      description: Command conflicts with the current session state.
      content:
        application/json:
          schema:
            $ref: ./common.schema.json#/$defs/ErrorEnvelope
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: ./common.schema.json#/$defs/ErrorEnvelope

  schemas:
    Session:
      $ref: ./session.schema.json
    LiveEvent:
      $ref: ./live-event.schema.json
    SessionSummary:
      $ref: ./session-summary.schema.json
    LandmarkFrame:
      $ref: ./landmark-frame.schema.json
    LiveMetrics:
      $ref: ./common.schema.json#/$defs/LiveMetrics
    LiveSummary:
      $ref: ./common.schema.json#/$defs/LiveSummary
    SessionArtifacts:
      $ref: ./common.schema.json#/$defs/SessionArtifacts
    ErrorEnvelope:
      $ref: ./common.schema.json#/$defs/ErrorEnvelope

    HealthResponse:
      type: object
      required: [status, version, live_engine, offline_worker]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?$'
        live_engine:
          type: string
          enum: [ok, unavailable, unknown]
        offline_worker:
          type: string
          enum: [ok, unavailable, unknown]
      additionalProperties: false

    PairingClaimRequest:
      type: object
      required: [pairing_code, device_name, platform]
      properties:
        pairing_code:
          type: string
          pattern: '^[0-9]{6}$'
        device_name:
          type: string
          minLength: 1
          maxLength: 96
        platform:
          type: string
          enum: [android, ios]
      additionalProperties: false

    PairingClaimResponse:
      type: object
      required: [token, core_url, expires_at]
      properties:
        token:
          type: string
          minLength: 8
          maxLength: 512
        core_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      additionalProperties: false

    CreateSessionRequest:
      type: object
      required: [exercise, view]
      properties:
        exercise:
          $ref: ./common.schema.json#/$defs/Exercise
        view:
          $ref: ./common.schema.json#/$defs/View
        target_reps:
          type: [integer, 'null']
          minimum: 1
          maximum: 999
          default: null
        notes:
          type: [string, 'null']
          maxLength: 1000
          default: null
      additionalProperties: false

    ControlConfig:
      type: object
      required: [exercise, view, target_reps]
      properties:
        exercise:
          $ref: ./common.schema.json#/$defs/Exercise
        view:
          $ref: ./common.schema.json#/$defs/View
        target_reps:
          type: integer
          minimum: 1
          maximum: 500
          default: 12
      additionalProperties: false

    SessionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: ./session.schema.json
        next_cursor:
          type: [string, 'null']
      additionalProperties: false

    EventsPage:
      type: object
      required: [items, next_seq]
      properties:
        items:
          type: array
          items:
            $ref: ./live-event.schema.json
        next_seq:
          type: integer
          minimum: 0
          description: Highest returned seq; pass it as after_seq on the next poll.
      additionalProperties: false

    ReportSummary:
      type: object
      required: [status, rep_count, rejected_rep_count, duration_s, quality_status, active_issue_count, severity_counts, mean_confidence, issues]
      properties:
        status:
          type: string
        rep_count:
          type: integer
          minimum: 0
        rejected_rep_count:
          type: integer
          minimum: 0
        quality_status:
          type: string
          enum: [pass, limited, reject, unknown]
        active_issue_count:
          type: integer
          minimum: 0
        duration_s:
          type: number
          minimum: 0
        severity_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        mean_confidence:
          type: number
          minimum: 0
          maximum: 1
        issues:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: false

    SessionReport:
      type: object
      required: [session_id, job_id, status, report_url, summary]
      properties:
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        job_id:
          type: [string, 'null']
          pattern: '^job_[A-Za-z0-9_-]{6,64}$'
        status:
          type: string
          enum: [completed, failed]
        report_url:
          type: [string, 'null']
          format: uri-reference
        summary:
          oneOf:
            - $ref: '#/components/schemas/ReportSummary'
            - type: 'null'
      additionalProperties: false

    MediaDeleteResponse:
      type: object
      required: [session_id, video_deleted, landmarks_deleted, report_deleted]
      properties:
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        video_deleted:
          type: boolean
        landmarks_deleted:
          type: boolean
        report_deleted:
          type: boolean
          description: False when include_report was false or no report existed.
      additionalProperties: false

    InternalStateUpdate:
      type: object
      required: [status, t_ms, payload]
      properties:
        status:
          $ref: ./common.schema.json#/$defs/SessionStatus
        t_ms:
          $ref: ./common.schema.json#/$defs/NonNegativeInteger
        payload:
          $ref: ./common.schema.json#/$defs/LiveMetrics
      additionalProperties: false

    InternalStateResponse:
      type: object
      required: [accepted, session_id, status]
      properties:
        accepted:
          const: true
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        status:
          $ref: ./common.schema.json#/$defs/SessionStatus
      additionalProperties: false

    FinalizeRequest:
      type: object
      required: [artifacts, summary]
      properties:
        artifacts:
          $ref: ./common.schema.json#/$defs/SessionArtifacts
        summary:
          $ref: ./common.schema.json#/$defs/LiveSummary
      additionalProperties: false

    FinalizeResponse:
      type: object
      required: [session_id, status, job_id]
      properties:
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        status:
          $ref: ./common.schema.json#/$defs/SessionStatus
        job_id:
          $ref: ./common.schema.json#/$defs/JobId
      additionalProperties: false

    LiveStartRequest:
      type: object
      required: [exercise, view, session_dir]
      properties:
        exercise:
          $ref: ./common.schema.json#/$defs/Exercise
        view:
          $ref: ./common.schema.json#/$defs/View
        target_reps:
          type: [integer, 'null']
          minimum: 1
          maximum: 999
          default: null
        session_dir:
          type: string
          minLength: 1
          maxLength: 4096
      additionalProperties: false

    LiveStartResponse:
      type: object
      required: [session_id, status, stream_url, ws_url]
      properties:
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        status:
          const: preparing
        stream_url:
          type: string
          format: uri
        ws_url:
          type: string
          format: uri
      additionalProperties: false

    LiveControlResponse:
      type: object
      required: [session_id, status]
      properties:
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        status:
          $ref: ./common.schema.json#/$defs/LiveSessionStatus
      additionalProperties: false

    LiveStopResponse:
      type: object
      required: [session_id, status, artifacts, summary]
      properties:
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        status:
          const: finalized
        artifacts:
          $ref: ./common.schema.json#/$defs/SessionArtifacts
        summary:
          $ref: ./common.schema.json#/$defs/LiveSummary
      additionalProperties: false

    SessionSnapshotMessage:
      type: object
      required: [type, version, session_id, server_time, payload]
      properties:
        type:
          const: session.snapshot
        version:
          const: v1
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        server_time:
          $ref: ./common.schema.json#/$defs/IsoTimestamp
        payload:
          $ref: ./session.schema.json
      additionalProperties: false

    ReportReadyMessage:
      type: object
      required: [type, version, session_id, job_id, report_url, summary]
      properties:
        type:
          const: report.ready
        version:
          const: v1
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        job_id:
          $ref: ./common.schema.json#/$defs/JobId
        report_url:
          type: string
          format: uri-reference
        summary:
          $ref: '#/components/schemas/ReportSummary'
      additionalProperties: false

    ReportProgressMessage:
      type: object
      required: [type, version, session_id, payload]
      properties:
        type:
          const: report.progress
        version:
          const: v1
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        payload:
          type: object
          required: [job_id, stage, progress]
          properties:
            job_id:
              $ref: ./common.schema.json#/$defs/JobId
            stage:
              type: string
            progress:
              type: number
              minimum: 0
              maximum: 1
          additionalProperties: false
      additionalProperties: false

    ErrorMessage:
      type: object
      required: [type, version, error]
      properties:
        type:
          const: error
        version:
          const: v1
        error:
          $ref: ./common.schema.json#/$defs/ApiError
      additionalProperties: false

    MirrorSessionStartMessage:
      type: object
      required: [type, version, session_id, payload]
      properties:
        type:
          const: session.start
        version:
          const: v1
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        payload:
          type: object
          required: [exercise, view, stream_url, ws_url]
          properties:
            exercise:
              $ref: ./common.schema.json#/$defs/Exercise
            view:
              $ref: ./common.schema.json#/$defs/View
            target_reps:
              type: [integer, 'null']
              minimum: 1
              maximum: 999
              default: null
            stream_url:
              type: string
              format: uri
            ws_url:
              type: string
              format: uri
          additionalProperties: false
      additionalProperties: false

    MirrorConfigMessage:
      type: object
      required: [type, version, payload]
      properties:
        type:
          const: session.config
        version:
          const: v1
        payload:
          $ref: '#/components/schemas/ControlConfig'
      additionalProperties: false

    MirrorDismissedMessage:
      type: object
      required: [type, version, session_id, payload]
      properties:
        type:
          const: session.dismissed
        version:
          const: v1
        session_id:
          $ref: ./common.schema.json#/$defs/SessionId
        payload:
          type: object
          required: [status]
          properties:
            status:
              $ref: ./common.schema.json#/$defs/SessionStatus
          additionalProperties: false
      additionalProperties: false

    MirrorStateMessage:
      type: object
      required: [type, version, payload]
      properties:
        type:
          const: mirror.state
        version:
          const: v1
        payload:
          type: object
          required: [state, session_id]
          properties:
            state:
              type: string
              enum: [idle, preparing, training, paused, error]
            session_id:
              oneOf:
                - $ref: ./common.schema.json#/$defs/SessionId
                - type: 'null'
          additionalProperties: false
      additionalProperties: false

    WeatherResponse:
      type: object
      required: [status, fetched_at]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        temperature_c:
          type: [number, 'null']
        humidity:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        weather_code:
          type: [integer, 'null']
        weather_text:
          type: [string, 'null']
        temp_min_c:
          type: [number, 'null']
        temp_max_c:
          type: [number, 'null']
        fetched_at:
          type: string
          format: date-time
        cached:
          type: boolean
          default: false
      additionalProperties: false

    TrendDay:
      type: object
      required: [date, sessions, duration_s, reps]
      properties:
        date:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        sessions:
          type: integer
          minimum: 0
        duration_s:
          type: number
          minimum: 0
        reps:
          type: integer
          minimum: 0
      additionalProperties: false

    TrendResponse:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/TrendDay'
      additionalProperties: false

    MirrorModule:
      type: object
      required: [id, size, column, order]
      properties:
        id:
          type: string
          enum: [weather, trend, todo, weekly_plan]
        size:
          type: string
          enum: ['1x1', '1x2']
        column:
          type: string
          enum: [left, right]
        order:
          type: integer
          minimum: 0
          maximum: 3
      additionalProperties: false

    MirrorLayout:
      type: object
      required: [version, modules, updated_at]
      properties:
        version:
          type: integer
          const: 2
        modules:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/MirrorModule'
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    MirrorFocusRequest:
      type: object
      required: [page]
      properties:
        page:
          type: string
          enum: [home, training, history, profile]
      additionalProperties: false

    MirrorFocusResponse:
      type: object
      required: [page, delivered]
      properties:
        page:
          type: string
          enum: [home, training, history, profile]
        delivered:
          const: true
      additionalProperties: false

    MirrorThemeRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [light, dark]
      additionalProperties: false

    MirrorThemeResponse:
      type: object
      required: [mode, delivered]
      properties:
        mode:
          type: string
          enum: [light, dark]
        delivered:
          const: true
      additionalProperties: false

    PairingDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PairingDevice'
      additionalProperties: false

    PairingDevice:
      type: object
      required: [device_name, platform, created_at]
      properties:
        device_name:
          type: string
        platform:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    PairingRevokeResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
      additionalProperties: false

    TodoItem:
      type: object
      required: [id, title, completed, todo_date, sort_order, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        completed:
          type: boolean
        todo_date:
          type: string
          format: date
        sort_order:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    TodoListResponse:
      type: object
      required: [date, items, completed, total]
      properties:
        date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoItem'
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
      additionalProperties: false

    TodoCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        todo_date:
          type: string
          format: date
        sort_order:
          type: integer
          minimum: 0
      additionalProperties: false

    TodoUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        completed:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
      additionalProperties: false

    WeeklyPlanItem:
      type: object
      required: [id, weekday, exercise, target_reps, sort_order, created_at, updated_at]
      properties:
        id:
          type: string
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        exercise:
          type: string
          enum: [squat, pushup]
        view:
          type: [string, 'null']
          enum: [front, rear, oblique_left, oblique_right, side_left, side_right, unknown, null]
        sets:
          type: [integer, 'null']
          minimum: 1
          maximum: 20
        target_reps:
          type: integer
          minimum: 1
          maximum: 500
        note:
          type: [string, 'null']
          maxLength: 300
        sort_order:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    WeeklyPlanListResponse:
      type: object
      required: [items, updated_at]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyPlanItem'
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    WeeklyPlanInput:
      type: object
      required: [weekday, exercise, target_reps]
      properties:
        id:
          type: string
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        exercise:
          type: string
          enum: [squat, pushup]
        view:
          type: [string, 'null']
          enum: [front, rear, oblique_left, oblique_right, side_left, side_right, unknown, null]
        sets:
          type: [integer, 'null']
          minimum: 1
          maximum: 20
        target_reps:
          type: integer
          minimum: 1
          maximum: 500
        note:
          type: [string, 'null']
          maxLength: 300
        sort_order:
          type: integer
          minimum: 0
      additionalProperties: false

    WeeklyPlanBatchUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/WeeklyPlanInput'
      additionalProperties: false

    TodoUpdatedMessage:
      type: object
      required: [type, version, payload]
      properties:
        type:
          const: todo.updated
        version:
          const: v1
        payload:
          $ref: '#/components/schemas/TodoListResponse'
      additionalProperties: false

    WeeklyPlanUpdatedMessage:
      type: object
      required: [type, version, payload]
      properties:
        type:
          const: weekly_plan.updated
        version:
          const: v1
        payload:
          $ref: '#/components/schemas/WeeklyPlanListResponse'
      additionalProperties: false

    MirrorLayoutMessage:
      type: object
      required: [type, version, payload]
      properties:
        type:
          const: mirror.layout
        version:
          const: v1
        payload:
          $ref: '#/components/schemas/MirrorLayout'
      additionalProperties: false

    MirrorPageMessage:
      type: object
      required: [type, version, payload]
      properties:
        type:
          const: mirror.page
        version:
          const: v1
        payload:
          type: object
          required: [page]
          properties:
            page:
              type: string
              enum: [home, training, history, profile]
          additionalProperties: false
      additionalProperties: false

    MirrorThemeMessage:
      type: object
      required: [type, version, payload]
      properties:
        type:
          const: mirror.theme
        version:
          const: v1
        payload:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [light, dark]
          additionalProperties: false
      additionalProperties: false

    PairingStateMessage:
      type: object
      required: [type, version, payload]
      properties:
        type:
          const: pairing.state
        version:
          const: v1
        payload:
          type: object
          required: [connected]
          properties:
            connected:
              type: boolean
          additionalProperties: false
      additionalProperties: false

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Read service health
      security: []
      responses:
        '200':
          description: Core service health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/pairing/claim:
    post:
      tags: [pairing]
      operationId: claimPairingCode
      summary: Exchange a short-lived pairing code for a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingClaimRequest'
      responses:
        '200':
          description: Device token issued.
          content:
            application/json:
              schema:
